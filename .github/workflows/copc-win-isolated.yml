name: COPC remote test (Windows, isolated)

# Builds only pdal_io_copc_remote_reader_test with the same environment and
# CMake setup as win.yml, then runs it alone, plainly and with curl
# tracing, to see where the /vsicurl/ read stalls. A gdal-master job checks
# whether GDAL's nightly build (with OSGeo/gdal#15007) fixes the hang.

on:
    push:
        branches: ["ci-copc-win"]
    workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copc-remote:
    name: COPC remote (${{ matrix.type }})
    runs-on: 'windows-latest'
    strategy:
      fail-fast: false
      matrix:
        # gdal-master: the current environment with libgdal-core replaced
        # by GDAL's nightly master build from the gdal-master channel
        type: ['current', 'fixed', 'gdal-master']
    defaults:
      run:
        shell: bash -l {0}
    env:
      BUILD_TYPE: ${{ matrix.type }}

    steps:
    - uses: actions/checkout@v7
    - uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64
    - uses: mamba-org/setup-micromamba@v3
      with:
        init-shell: bash
        environment-file: "scripts/ci/${{ matrix.type == 'gdal-master' && 'current' || matrix.type }}-environment.yml"
        environment-name: "pdal-build"
        # gdal-master shares current's cache key, so keep it from saving its
        # modified environment under that key
        cache-environment: ${{ matrix.type != 'gdal-master' }}
        cache-downloads: true

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}-windows-${{ matrix.type }}
        max-size: 2G

    - name: Setup
      run: |
          source ./scripts/ci/win/setup.sh

    - name: Install GDAL master nightly
      if: matrix.type == 'gdal-master'
      run: |
          micromamba install -y -n pdal-build \
              -c gdal-master -c conda-forge "libgdal-core=3.13.99"

    # ccache can't cache MSVC /Zi (shared PDB) compiles, so switch
    # RelWithDebInfo to /Z7 (embedded debug info). That setting needs
    # policy CMP0141, which PDAL's cmake_minimum_required(3.13) leaves unset.
    - name: CMake
      working-directory: ./build
      run: |
          source ../scripts/ci/win/cmake.sh \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
              -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

    - name: Compile test only
      working-directory: ./build
      run: |
          ccache -z
          ninja pdal_io_copc_remote_reader_test
          ccache -s

    - name: Versions
      run: |
          gdalinfo --version
          micromamba list -n pdal-build | grep -Ei '^\s*(libgdal|gdal|libcurl|curl|openssl|libssh2|zstd) ' || true

    - name: Test via ctest (as in win.yml)
      id: ctest
      continue-on-error: true
      timeout-minutes: 7
      working-directory: ./build
      run: |
          ctest -R '^pdal_io_copc_remote_reader_test$' -VV --output-on-failure

    # CPL_* traces GDAL's /vsicurl/ read; ARBITER_VERBOSE traces the plain
    # https:// read, which goes through PDAL's vendored arbiter instead.
    - name: Test direct with curl tracing
      continue-on-error: true
      timeout-minutes: 7
      working-directory: ./build
      env:
        CPL_DEBUG: "ON"
        CPL_CURL_VERBOSE: "YES"
        ARBITER_VERBOSE: "1"
      run: |
          start=$(date +%s)
          timeout 300 ./bin/pdal_io_copc_remote_reader_test.exe 2>&1 \
              | while IFS= read -r line; do
                    printf '[+%4ss] %s\n' "$(( $(date +%s) - start ))" "$line"
                done
          echo "exit status: ${PIPESTATUS[0]} after $(( $(date +%s) - start ))s"

    - name: Fail if ctest failed
      if: steps.ctest.outcome != 'success'
      run: |
          echo "ctest run of pdal_io_copc_remote_reader_test failed"
          exit 1
